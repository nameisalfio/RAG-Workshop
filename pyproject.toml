[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-workshop"
version = "0.1.0"
description = "End-to-end RAG pipeline used as the live demo of the RAG workshop."
requires-python = ">=3.12"
dependencies = [
    "hydra-core==1.3.2",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "docling>=2.0",
    "python-docx>=1.1",
    "tokenizers>=0.20",
    "torch>=2.4",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "qdrant-client>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["conf/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads the real embedding model (slow, downloads about 2.3 GB on first use)"]
addopts = "-m 'not model'"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pymupdf4llm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN"]
