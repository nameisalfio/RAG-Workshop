server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The page loads nothing from other sites.
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The browser must ask whether a file changed before reusing its copy. Without this line it can
    # pair a new page with an old script after an update, and the buttons stop responding.
    add_header Cache-Control "no-cache" always;

    # Name server of Docker. Together with the variable below it makes nginx look up the address of
    # the backend again while running: without it the address found at start is kept for ever, and
    # the interface stops working as soon as the backend container is created again.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # A free model can take more than a minute to write an answer, and measuring retrieval on
        # the whole golden set keeps the re-ranker busy for several minutes.
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
