# Golden set: questions with the passages that hold the answer and the correct answer.
#
# Each entry:
#   id        short unique name
#   type      what makes the question hard (see the list below)
#   question  the question, as a user would ask it
#   answer    the correct answer, in a sentence
#   facts     what a correct answer must say. Each fact is a list of alternative wordings:
#             one of them is enough. An unanswerable question has no facts.
#   context   the passages that hold the answer: a document (start of its file name) and,
#             optionally, a section (start of its heading). Empty for unanswerable questions.
#
# Types:
#   direct          one document states the answer
#   superseded      an older text says something else: an addendum, a new version or a bulletin wins
#   lookalike       other documents hold the same sentence with another value
#   table           the answer is a cell of a table
#   scan            the document is a scanned page read with OCR
#   cross-language  the question is in Italian, the document in English
#   unanswerable    the documents do not hold the answer: the system must say so
#
# Answers describe what is in force on 9 October 2026.

